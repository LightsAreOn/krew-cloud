<!DOCTYPE html>
<html lang="en"><head>
<meta http-equiv="content-type" content="text/html; charset=UTF-8">
  <meta charset="UTF-8">
  <title>KREW 1.9 · Launch Countdown</title>
  <link rel="preconnect" href="https://fonts.googleapis.com/">
  <link href="KREW%201.9%20%C2%B7%20Launch%20Countdown_files/css2.css" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #060A0F;
      font-family: 'IBM Plex Mono', monospace;
      -webkit-font-smoothing: antialiased;
      user-select: none;
    }

    /* Subtle teal grid */
    .grid-bg {
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(0,255,178,0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,255,178,0.025) 1px, transparent 1px);
      background-size: 64px 64px;
      pointer-events: none;
    }

    /* Radial glow behind numbers */
    .glow {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 80vw;
      height: 50vh;
      background: radial-gradient(ellipse at center, rgba(0,255,178,0.05) 0%, transparent 70%);
      pointer-events: none;
    }

    /* Corner marks */
    .corner {
      position: fixed;
      width: 24px;
      height: 24px;
      pointer-events: none;
    }
    .corner--tl { top: 24px; left: 24px; border-top: 1px solid #4A6070; border-left: 1px solid #4A6070; }
    .corner--tr { top: 24px; right: 24px; border-top: 1px solid #4A6070; border-right: 1px solid #4A6070; }
    .corner--bl { bottom: 24px; left: 24px; border-bottom: 1px solid #4A6070; border-left: 1px solid #4A6070; }
    .corner--br { bottom: 24px; right: 24px; border-bottom: 1px solid #4A6070; border-right: 1px solid #4A6070; }

    /* Layout */
    #root {
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    /* Top bar */
    .topbar {
      position: fixed;
      top: 0; left: 0; right: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 32px 48px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .wordmark {
      color: #00FFB2;
      font-weight: 700;
      font-size: 15px;
      letter-spacing: 7px;
    }

    .topright { text-align: right; }
    .clock-time {
      font-size: 18px;
      font-weight: 700;
      color: #B8C8D8;
      letter-spacing: 2px;
    }
    .clock-date {
      font-size: 9px;
      letter-spacing: 3px;
      color: #4A6070;
      margin-top: 4px;
    }

    /* Center */
    .center {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .eyebrow {
      font-size: 10px;
      letter-spacing: 6px;
      color: #4A6070;
      text-transform: uppercase;
      margin-bottom: 6px;
    }
    .ver-tag {
      font-size: 12px;
      letter-spacing: 6px;
      font-weight: 700;
      color: #00FFB2;
      margin-bottom: min(52px, 5vh);
    }

    /* Countdown — scales with viewport, caps at wallpaper size */
    .countdown {
      display: flex;
      align-items: flex-start;
      flex-wrap: wrap;
      justify-content: center;
    }

    .unit {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: min(14px, 1.5vh);
    }

    .num {
      font-size: min(10vw, 148px);
      font-weight: 700;
      color: #00FFB2;
      line-height: 1;
      letter-spacing: -2px;
      text-align: center;
      min-width: min(13vw, 200px);
    }
    #sec-num { color: #00A870; }

    .lbl {
      font-size: min(1vw, 10px);
      letter-spacing: 5px;
      color: #4A6070;
    }

    .sep {
      font-size: min(6.5vw, 96px);
      font-weight: 700;
      color: #1A2A35;
      line-height: 1;
      padding: 0 min(1vw, 12px);
    }

    /* Progress */
    .prog-section {
      margin-top: min(5vh, 56px);
      width: min(72vw, 860px);
    }
    .prog-track {
      height: 1px;
      background: #0D1820;
    }
    .prog-fill {
      height: 100%;
      background: #00FFB2;
      transition: width 1s linear;
      box-shadow: 0 0 6px rgba(0,255,178,0.4);
    }
    .prog-labels {
      display: flex;
      justify-content: space-between;
      margin-top: 10px;
      font-size: 9px;
      letter-spacing: 3px;
      color: #4A6070;
    }
    .prog-labels .pct { color: #667788; }

    /* Bottom */
    .bottombar {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      display: flex;
      justify-content: center;
      padding: 30px;
    }
    .tagline {
      font-size: 9px;
      letter-spacing: 4px;
      color: #4A6070;
    }
  </style>
</head>
<body>

<div class="grid-bg"></div>
<div class="glow"></div>
<div class="corner corner--tl"></div>
<div class="corner corner--tr"></div>
<div class="corner corner--bl"></div>
<div class="corner corner--br"></div>

<div id="root">

  <!-- TOP BAR -->
  <div class="topbar">
    <div class="logo">
      <svg width="20" height="20" viewBox="0 0 80 80" fill="#00FFB2">
        <defs><clipPath id="ks"><circle cx="40" cy="40" r="40"></circle></clipPath></defs>
        <g clip-path="url(#ks)">
          <circle cx="28" cy="52" r="20"></circle>
          <circle cx="58" cy="22" r="17"></circle>
          <circle cx="64" cy="58" r="14"></circle>
          <circle cx="16" cy="24" r="12"></circle>
          <circle cx="42" cy="42" r="10"></circle>
          <circle cx="72" cy="38" r="9"></circle>
          <circle cx="18" cy="58" r="7"></circle>
          <circle cx="55" cy="74" r="8"></circle>
        </g>
      </svg>
      <span class="wordmark">KREW</span>
    </div>
    <div class="topright">
      <div class="clock-time" id="clock-time">21:02:01</div>
      <div class="clock-date" id="clock-date">THURSDAY, 18 JUNE 2026</div>
    </div>
  </div>

  <!-- CENTER -->
  <div class="center">
    <div class="eyebrow">Until MVP Launch</div>
    <div class="ver-tag">VERSION 1.9</div>

    <div class="countdown">
      <div class="unit">
        <div class="num" id="days-num">145</div>
        <div class="lbl">DAYS</div>
      </div>
      <div class="sep">:</div>
      <div class="unit">
        <div class="num" id="hrs-num">03</div>
        <div class="lbl">HRS</div>
      </div>
      <div class="sep">:</div>
      <div class="unit">
        <div class="num" id="min-num">57</div>
        <div class="lbl">MIN</div>
      </div>
      <div class="sep">:</div>
      <div class="unit">
        <div class="num" id="sec-num">58</div>
        <div class="lbl">SEC</div>
      </div>
    </div>

    <!-- PROGRESS -->
    <div class="prog-section">
      <div class="prog-track">
        <div class="prog-fill" id="pbar" style="width: 3.25003%;"></div>
      </div>
      <div class="prog-labels">
        <span>14 JUN 2026</span>
        <span class="pct" id="pct-lbl">3.3% ELAPSED</span>
        <span>11 NOV 2026</span>
      </div>
    </div>
  </div>

  <!-- BOTTOM -->
  <div class="bottombar">
    <span class="tagline">The lights are on.</span>
  </div>

</div>

<script>
  const START_MS  = new Date('2026-06-14T00:00:00').getTime();
  const LAUNCH_MS = new Date('2026-11-11T00:00:00').getTime();
  const pad = n => String(Math.max(0, n)).padStart(2, '0');

  function tick() {
    const now = Date.now();
    const rem = Math.max(0, LAUNCH_MS - now);

    document.getElementById('days-num').textContent = Math.floor(rem / 86400000);
    document.getElementById('hrs-num').textContent  = pad(Math.floor(rem % 86400000 / 3600000));
    document.getElementById('min-num').textContent  = pad(Math.floor(rem % 3600000  / 60000));
    document.getElementById('sec-num').textContent  = pad(Math.floor(rem % 60000    / 1000));

    const pct = Math.min(100, Math.max(0, ((now - START_MS) / (LAUNCH_MS - START_MS)) * 100));
    document.getElementById('pbar').style.width     = pct + '%';
    document.getElementById('pct-lbl').textContent  = pct.toFixed(1) + '% ELAPSED';

    const d = new Date();
    document.getElementById('clock-time').textContent =
      pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds());
    document.getElementById('clock-date').textContent =
      d.toLocaleDateString('en-GB', { weekday: 'long', day: '2-digit', month: 'long', year: 'numeric' }).toUpperCase();
  }

  tick();
  setInterval(tick, 1000);
</script>


</body></html>
