<style>
  .krew-ai-label {

    background: #F2F5F8;
    border: 1px solid #D0D5DC;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    font-weight: 500;
    color: #2A3540;
    letter-spacing: 0.02em;
    text-decoration: none;
    line-height: 1;
    /* No border-radius — KREW brand rule */
  }
  .krew-ai-label:hover {
    background: #E4E9EF;
    border-color: #B0BCC8;
  }
  .krew-ai-label svg {
    width: 22px;
    height: 22px;
    flex-shrink: 0;
    display: block;
  }
  /* Dark background variant */

    background: #0A0E14;
    border-color: #1A2530;
    color: #B8C8D8;
  }
</style>
